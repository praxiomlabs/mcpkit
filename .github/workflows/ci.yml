name: CI

on:
  # Only run on pushes to the trunk; feature/fix/refactor branches get CI via
  # their pull request instead, so a branch with an open PR runs CI once, not
  # twice (a push-event run plus a pull_request-event run).
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded in-progress runs for the same PR/branch so rapid pushes
# don't pile up and contend for runners. Pushes to the default branch are not
# cancelled (so post-merge runs always complete).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # ==========================================================================
  # Change detection - lets PRs that touch no Rust/build files skip the heavy
  # compile/test/semver jobs. Pushes to the trunk always run everything (the
  # `|| github.event_name == 'push'` guards below), so trunk coverage is never
  # reduced by this filter.
  # ==========================================================================

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      release-tooling: ${{ steps.filter.outputs.release-tooling }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '**/build.rs'
              - 'crates/mcpkit-transport/proto/**'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
            release-tooling:
              - 'scripts/publish-crates*.sh'
              - '.github/workflows/release.yml'

  # ==========================================================================
  # Fast checks - run first, fail fast
  # ==========================================================================

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # PR branches restore the trunk cache but don't save their own
          # (per-branch caches just churn the 10 GB ceiling). Only the
          # default-branch run writes the shared cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-features --all-targets -- -D warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --all-features --all-targets

  # Three checks that existed only as Justfile recipes and so never ran on any
  # PR. That gap is how two dependencies stayed declared behind cargo-machete
  # justifications that were false, and how spelling regressions reached main:
  # the checks were written, nothing enforced them.
  hygiene:
    name: Hygiene (spelling, unused deps, shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Spell check
        # Pinned: @master turns CI red on an upstream release with no repo change.
        uses: crate-ci/typos@v1.29.4
        with:
          files: ./crates ./mcpkit ./examples ./docs ./spec ./scripts ./README.md ./CHANGELOG.md ./RELEASING.md ./ROADMAP.md ./CONTRIBUTING.md
      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      # Fails on an unused dependency *and* on an `ignored` entry whose
      # dependency is actually used — a stale suppression is the thing that hid
      # the unused deps in the first place.
      - name: Unused dependencies
        run: cargo machete
      # shellcheck ships on ubuntu-latest. -S warning is the bar the repo's
      # scripts already meet; info/style findings (e.g. SC2016 for jq programs
      # quoted on purpose) are not failures.
      - name: Shell check
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          printf 'checking %d script(s)\n' "${#scripts[@]}"
          shellcheck -S warning "${scripts[@]}"

  version-sync:
    name: Version Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check documentation versions match Cargo.toml
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mcpkit") | .version')
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)

          echo "Checking documentation references mcpkit version $MAJOR_MINOR..."
          FAIL=0

          # Every snippet-bearing doc must reference the current version at
          # least once (umbrella crate or subcrate — all published mcpkit-*
          # crates share the workspace version).
          for f in README.md docs/getting-started.md docs/client-guide.md \
                   docs/extensions.md docs/runtimes.md docs/wasm.md \
                   docs/migration-from-rmcp.md; do
            if ! grep -qE "mcpkit(-[a-z]+)? = \"$MAJOR_MINOR\"" "$f"; then
              echo "ERROR: $f does not reference mcpkit(-*) = \"$MAJOR_MINOR\""
              FAIL=1
            fi
          done

          # No doc may pin any OTHER mcpkit version — this catches partially
          # bumped files, which the per-file presence check alone would pass.
          # Allowlisted: files where old versions are intentional (migration
          # rollback targets, stability policy examples, point-in-time ADRs).
          STALE=$(grep -rnE "mcpkit(-[a-z]+)? = \"[0-9]" README.md docs/ \
              --exclude=migration-to-1.0.md \
              --exclude=api-stability.md \
              --exclude-dir=adr \
            | grep -vE "mcpkit(-[a-z]+)? = \"$MAJOR_MINOR\"" || true)
          if [ -n "$STALE" ]; then
            echo "ERROR: stale mcpkit version references (expected $MAJOR_MINOR):"
            echo "$STALE"
            FAIL=1
          fi

          # RELEASING.md declares the release it documents in its own header,
          # using a different syntax from the dependency snippets above and
          # living at the repo root — so neither the per-file presence check nor
          # the stale sweep could see it. It sat at 0.6.0 for the whole 0.7.0
          # cycle and was only caught by hand during release prep.
          if ! grep -qE "^\*\*Version:\*\* ${VERSION}( |$)" RELEASING.md; then
            echo "ERROR: RELEASING.md header does not declare **Version:** $VERSION"
            grep -nE "^\*\*Version:\*\*" RELEASING.md || true
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "All version references are correct!"

  # Relative links and anchors in markdown — offline, no network.
  #
  # This job used to check external http/https links too, and that made merges
  # depend on third-party uptime. It has now failed three distinct ways with no
  # change to the repo: lychee resolving `file://` fixtures against the runner
  # filesystem, rate-limit timeouts from link volume, and (2026-07-27) a 415
  # from effective-rust.com that turned `main` red on a docs-only release-prep
  # commit while the same URL served 200 everywhere else. Each was answered with
  # another exclude, and the list grew every time reality surprised it.
  #
  # External links moved to .github/workflows/link-check-external.yml, which
  # runs on a schedule. A broken external link is worth knowing about; it is not
  # worth blocking a merge that did not cause it.
  #
  # Scope is markdown only. Rust sources are deliberately excluded: they embed
  # `file://` fixture URIs (46 of them) that offline mode resolves and reports
  # as missing files. Rustdoc intra-doc links are already validated by the
  # Documentation job's `RUSTDOCFLAGS=-D warnings`.
  link-check:
    name: Link Check (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check relative links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          # --include-fragments=anchor-only checks `#section` targets inside the
          # repo. It caught a real break the http/https-only job could never
          # see: CONTRIBUTING.md pointed at
          # docs/versioning.md#minimum-supported-rust-version, but the heading
          # slug is #minimum-supported-rust-version-msrv.
          args: >
            --offline
            --verbose
            --no-progress
            --include-fragments=anchor-only
            './docs/**/*.md'
            './README.md'
            './CONTRIBUTING.md'
            './spec/**/*.md'
          fail: true
          failIfEmpty: true

  # Diffs mcpkit's wire vocabulary against the vendored official schema.
  # Ungated on purpose: spec/** and scripts/** match no path filter in the
  # `changes` job, so without this job nothing in CI validates either artifact.
  schema-check:
    name: Schema Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Diff against the vendored 2025-11-25 schema
        run: |
          set -euo pipefail
          scripts/schema-diff.sh > /tmp/schema-report.txt
          scripts/schema-diff.sh --baseline > /tmp/schema-actual.txt
          grep -vE '^\s*(#|$)' spec/schema-diff-baseline.txt > /tmp/schema-expected.txt
          if diff -u /tmp/schema-expected.txt /tmp/schema-actual.txt; then
            echo "Schema difference set matches the baseline."
          else
            echo "::error::mcpkit's wire vocabulary drifted from the vendored schema."
            echo "Lines prefixed '+' are new differences (a regression)."
            echo "Lines prefixed '-' were closed — update spec/schema-diff-baseline.txt."
            echo "Regenerate with: scripts/schema-diff.sh --baseline"
            exit 1
          fi
      - name: Report
        if: always()
        run: cat /tmp/schema-report.txt
      # Fails only when the vendored file genuinely differs from its pin. A fetch
      # that cannot complete — GitHub outage, rate limit — warns and passes:
      # turning someone else's downtime into a red build on an unrelated PR
      # teaches people to ignore this job, which is the opposite of the point.
      # Tampering is still caught pre-merge on any run where the network works.
      - name: Verify the vendored schema still matches its pinned upstream commit
        run: |
          set -uo pipefail
          sha="$(grep -oE '\b[0-9a-f]{40}\b' spec/PROVENANCE.md | awk 'NR==1')"
          if [ -z "$sha" ]; then
            echo "::error::no commit SHA found in spec/PROVENANCE.md"
            exit 1
          fi
          if ! curl -fsSL --retry 3 --retry-delay 2 --max-time 30 -o /tmp/upstream-schema.json \
            "https://raw.githubusercontent.com/modelcontextprotocol/modelcontextprotocol/$sha/schema/2025-11-25/schema.json"; then
            echo "::warning::could not fetch upstream schema at $sha — integrity check skipped, not failed"
            exit 0
          fi
          if ! diff -q /tmp/upstream-schema.json spec/2025-11-25/schema.json; then
            echo "::error::spec/2025-11-25/schema.json differs from upstream commit $sha"
            exit 1
          fi
          echo "Vendored schema matches upstream $sha."

  # ==========================================================================
  # Core tests - run after fast checks pass
  # ==========================================================================

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy, check]
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --all-features
      # trybuild spins up a throwaway cargo project under target/tests; remove it
      # so the rust-cache save step doesn't trip over its torn-down scratch dirs
      # (harmless ENOENT annotations otherwise).
      - name: Remove trybuild scratch before cache save
        if: always()
        shell: bash
        run: rm -rf target/tests

  # ==========================================================================
  # Code Coverage - runs on the trunk (push) only. Keeping it off the PR path
  # removes ~8.5 min of interactive wait; the trunk run still publishes the
  # coverage trend to Codecov and warms the (branch-scoped) coverage cache.
  # ==========================================================================

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Remove trybuild scratch before cache save
        if: always()
        shell: bash
        run: rm -rf target/tests

  # ==========================================================================
  # Security & compliance
  # ==========================================================================

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  # ==========================================================================
  # Documentation
  # ==========================================================================

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy, check]
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -Dwarnings

  # ==========================================================================
  # MSRV - Minimum Supported Rust Version
  # ==========================================================================

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy, check]
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Only check library code compiles with MSRV, not tests/dev-dependencies
      # (wiremock 0.6+ requires Rust 1.87 for let chains)
      - run: cargo check --all-features --lib -p mcpkit

  # ==========================================================================
  # Cross-platform matrix - PRs only, and only when code changed (skip docs PRs)
  # ==========================================================================

  test-matrix:
    name: Test (${{ matrix.os }})
    needs: [changes, test]
    # Also runs on pushes to main — not because main needs the coverage, but
    # because rust-cache can only be RESTORED from the current branch or the
    # base branch. While this job was pull_request-only, main never wrote an
    # entry, so every PR started cold. Measured on PR #189: the Windows job
    # logged "No cache found." and took 12m52s, four times the ubuntu Test
    # Suite, and it is the single longest job in the pipeline.
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'push' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS moved to .github/workflows/cross-platform.yml (scheduled). It
        # cost 6m16s on every PR and, across the last 40 CI runs, failed zero
        # times. Windows stays on the PR path: it has caught exactly one real
        # break (4ae4f9f), which is one more than macOS.
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
        with:
          # Without this, PRs write ~GB entries scoped to their own ref that
          # nothing else can restore, while competing for the 10 GB Actions
          # cache limit and LRU-evicting main's entries. Same reasoning as the
          # clippy/check jobs above.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Use --features full instead of --all-features to exclude regenerate-proto
      # (protobuf-src fails to build on Windows due to abseil-cpp linker issues)
      - run: cargo test -p mcpkit-transport --features full
      # --all-features here is safe: regenerate-proto is only reachable through
      # mcpkit-transport (excluded), so the rest of the workspace gets its
      # feature-gated code (e.g. jwt) exercised cross-platform.
      - run: cargo test --workspace --exclude mcpkit-transport --all-features
      - name: Remove trybuild scratch before cache save
        if: always()
        shell: bash
        run: rm -rf target/tests

  # ==========================================================================
  # Semver check - ensure no accidental breaking changes
  # ==========================================================================

  semver:
    name: Semver Check
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy, check]
    # Run on code-changing PRs (compare against the published baseline), and on
    # pushes to the trunk. The trunk run seeds the per-package baseline-rustdoc
    # cache that the action shares back to PRs: GitHub caches are branch-scoped,
    # so the cache has to be written on the default branch to be restorable by
    # PR branches. Docs-only changes skip this (no API can change).
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v6
      # The official action caches each publishable crate's baseline rustdoc
      # across runs, so the unchanging published baseline is not rebuilt on every
      # PR (which was ~half the job). It installs the toolchain and checks the
      # whole workspace (skipping `publish = false` crates) by default.
      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          rust-toolchain: "1.96"
          verbose: true

  # ==========================================================================
  # Aggregate gate - a single job that summarizes the required checks. Mark
  # THIS job as the required status check on the branch protection rule: it
  # stays green when heavy jobs are legitimately skipped (e.g. docs-only PRs)
  # and fails if any required job failed or was cancelled, so path-filtering
  # never deadlocks a required check.
  # ==========================================================================

  publish-script:
    name: Publish Script Harness
    needs: changes
    if: ${{ needs.changes.outputs.release-tooling == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run publish-script harness (stub cargo, three paths)
        run: bash scripts/publish-crates-test.sh

  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs:
      [
        changes,
        fmt,
        clippy,
        check,
        version-sync,
        link-check,
        schema-check,
        hygiene,
        test,
        deny,
        docs,
        msrv,
        test-matrix,
        semver,
        publish-script,
      ]
    runs-on: ubuntu-latest
    steps:
      # Treating *any* skip as a pass made this gate green on a run where almost
      # nothing executed: a PR touching only paths outside the `changes` filter
      # skips clippy/check/test/deny/docs/msrv/semver and still reports success.
      #
      # Skipping is legitimate — a docs-only PR should not run the test matrix —
      # so this does not simply fail on `skipped`. It re-evaluates each job's own
      # gating condition and tolerates a skip only where that condition was
      # genuinely false. A job that skipped while it was owed work is a filter
      # bug, and fails here.
      - name: Verify required jobs ran and passed
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RELEASE_TOOLING: ${{ needs.changes.outputs.release-tooling }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          fail=0

          # require <job> <result> <expected-to-run 0|1>
          require() {
            case "$2" in
              success) ;;
              skipped)
                if [ "$3" = 1 ]; then
                  echo "::error::$1 was skipped, but its gating condition was true — required work did not run"
                  fail=1
                else
                  echo "note: $1 skipped (not applicable to this run)"
                fi
                ;;
              *)
                echo "::error::$1 did not pass (result: $2)"
                fail=1
                ;;
            esac
          }

          # Mirrors each job's `if:` expression. Keep in sync when a job's
          # gating changes — a stale predicate here re-opens the hole.
          gated=0   # clippy, check, test, deny, docs, msrv, test-matrix
          if [ "$CODE" = "true" ] || [ "$EVENT" = "push" ]; then gated=1; fi
          sem=0     # semver: (pull_request OR push) AND code
          if { [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "push" ]; } && [ "$CODE" = "true" ]; then sem=1; fi
          pub=0     # publish-script: release-tooling OR push
          if [ "$RELEASE_TOOLING" = "true" ] || [ "$EVENT" = "push" ]; then pub=1; fi

          # Ungated jobs have no `if:` and must always run.
          require changes       '${{ needs.changes.result }}'       1
          require fmt           '${{ needs.fmt.result }}'           1
          require version-sync  '${{ needs.version-sync.result }}'  1
          require link-check    '${{ needs.link-check.result }}'    1
          require schema-check  '${{ needs.schema-check.result }}'  1
          require hygiene       '${{ needs.hygiene.result }}'       1

          require clippy        '${{ needs.clippy.result }}'        "$gated"
          require check         '${{ needs.check.result }}'         "$gated"
          require test          '${{ needs.test.result }}'          "$gated"
          require deny          '${{ needs.deny.result }}'          "$gated"
          require docs          '${{ needs.docs.result }}'          "$gated"
          require msrv          '${{ needs.msrv.result }}'          "$gated"
          # test-matrix now shares the `gated` predicate: it gained the
          # `|| push` arm so pushes to main seed the rust-cache entry that PRs
          # restore from. It previously had its own `pull_request AND code`
          # predicate here.
          require test-matrix   '${{ needs.test-matrix.result }}'   "$gated"
          require semver        '${{ needs.semver.result }}'        "$sem"
          require publish-script '${{ needs.publish-script.result }}' "$pub"

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "All required checks ran and passed."
